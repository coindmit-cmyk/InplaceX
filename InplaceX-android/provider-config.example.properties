# Copy the variant-specific keys you need into local.properties.
# Keep real ids outside Git.

# Mirkori Games Platform (public origins, never credentials)
platform.debug.baseUrl=https://games.dmit.life
platform.release.baseUrl=https://games.dmit.life

# Backend origin used by online play and dynamic advertising market resolution.
# Release must be HTTPS and must not include a path.
online.debug.baseUrl=
online.release.baseUrl=

# Google Play / Google Cloud
provider.debug.googlePlay.webClientId=
provider.debug.googlePlay.serverClientId=
provider.debug.googlePlay.gamesProjectId=
provider.release.googlePlay.webClientId=
provider.release.googlePlay.serverClientId=
provider.release.googlePlay.gamesProjectId=

# Ads: Yandex is the temporary route in every market until another provider is connected.
# Banner and rewarded ids are required for release. Interstitial is optional.
provider.debug.ads.yandex.owner.banner.game=
provider.debug.ads.yandex.owner.rewarded.general=
provider.debug.ads.yandex.owner.interstitial.postMatch=
provider.release.ads.yandex.owner.banner.game=
provider.release.ads.yandex.owner.rewarded.general=
provider.release.ads.yandex.owner.interstitial.postMatch=

# Post-match interstitial cadence. Set the foreground threshold before release.
provider.debug.ads.interstitial.minimumCompletedMatches=20
provider.debug.ads.interstitial.minimumForegroundSeconds=0
provider.debug.ads.interstitial.gamesBetweenImpressions=4
provider.release.ads.interstitial.minimumCompletedMatches=20
provider.release.ads.interstitial.minimumForegroundSeconds=1800
provider.release.ads.interstitial.gamesBetweenImpressions=4

# Mirkori Games Platform commerce product IDs (not Google Play Billing)
provider.debug.billing.removeAdsProductId=remove_ads
provider.debug.billing.proSubscriptionId=pro_subscription
provider.debug.billing.proPlusSubscriptionId=pro_plus_subscription
provider.release.billing.removeAdsProductId=inplacex.remove_ads
provider.release.billing.proSubscriptionId=inplacex.pro
provider.release.billing.proPlusSubscriptionId=inplacex.pro_plus
