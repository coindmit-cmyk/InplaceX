<rect width="1200" height="760" fill="#231810"/>
<text x="50" y="58" font-family="Arial" font-size="34" font-weight="700" fill="#FFF9EC">InplaceX Final UI — component states</text>
<text x="50" y="92" font-family="Arial" font-size="18" fill="#D8B879">Warm room / polished casual · 4dp grid · one border + one shadow</text>

