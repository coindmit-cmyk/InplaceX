idth="2"/><text x="885" y="423" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">5</text><text x="885" y="475" text-anchor="middle" font-family="Arial" font-size="14" fill="#FFF9EC">Locked exact</text><rect x="1010" y="378" width="70" height="70" rx="8" fill="#B9B2A7" fill-opacity="0.22" stroke="#B9B2A7" stroke-width="1"/><text x="1045" y="423" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#725A3C">5</text><text x="1045" y="475" text-anchor="middle" font-family="Arial" font-size="14" fill="#FFF9EC">Disabled</text>
