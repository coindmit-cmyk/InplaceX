name: InplaceX CI

on:
  push:
    branches:
      - develop
      - production
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inplacex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.java.installations.auto-detect=true
    -Dorg.gradle.java.installations.auto-download=true
    -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Unit, lint, and debug artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and signing tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify JVM launcher and toolchains
        run: |
          java -version
          ./gradlew --version
          ./gradlew -q javaToolchains

      - name: Run unit verification
        run: ./gradlew verifyProject

      - name: Run Android lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Write debug artifact identity
        run: bash scripts/ci/artifact_identity.sh --apk InplaceX-android/app/build/outputs/apk/debug/app-debug.apk --output-dir build/ci-artifacts --artifact-type debug --expected-signing verified

      - name: Upload identified debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: inplacex-debug-artifact
          path: build/ci-artifacts
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: API 35 emulator instrumentation
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platform-tools" "platforms;android-36"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests on API 35 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/run_instrumentation.sh

  release:
    name: Release artifact checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and signing tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install CI-only provider configuration
        run: install -m 0600 InplaceX-android/provider-config.ci.properties local.properties

      - name: Assemble unsigned release candidate
        run: ./gradlew :app:assembleRelease

      - name: Write release artifact identity
        run: bash scripts/ci/artifact_identity.sh --apk InplaceX-android/app/build/outputs/apk/release/app-release-unsigned.apk --output-dir build/ci-release-artifacts --artifact-type release --expected-signing unverified

      - name: Upload identified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: inplacex-release-artifact
          path: build/ci-release-artifacts
          if-no-files-found: error
          retention-days: 14

  ci-contract:
    name: CI contract guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Validate CI contract and hostile fixtures
        run: python3 scripts/ci/validate_ci_contract.py --self-test
