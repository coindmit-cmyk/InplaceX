name: InplaceX CI

on:
  push:
    branches:
      - develop
      - production
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inplacex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.java.installations.auto-detect=true
    -Dorg.gradle.java.installations.auto-download=true
    -Dfile.encoding=UTF-8

jobs:
  verify:
    name: Unit verification and debug artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platform-tools" "platforms;android-36"

      - name: Verify JVM launcher and toolchains
        run: |
          java -version
          ./gradlew --version
          ./gradlew -q javaToolchains

      - name: Run unit verification
        run: ./gradlew verifyProject

      - name: Run Android lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Write artifact identity
        id: artifact_identity
        run: bash scripts/ci/artifact_identity.sh --apk InplaceX-android/app/build/outputs/apk/debug/app-debug.apk --output-dir build/ci-artifacts

      - name: Upload identified debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: inplacex-debug-artifact
          path: build/ci-artifacts
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Instrumentation checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platform-tools" "platforms;android-36" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Provision and run instrumentation checks
        run: bash scripts/ci/run_instrumentation.sh

  release:
    name: Release checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platform-tools" "platforms;android-36"

      - name: Assemble release candidate
        run: ./gradlew :app:assembleRelease

      - name: Write release artifact identity
        run: bash scripts/ci/artifact_identity.sh --apk InplaceX-android/app/build/outputs/apk/release/app-release-unsigned.apk --output-dir build/ci-release-artifacts --artifact-type release

      - name: Upload identified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: inplacex-release-artifact
          path: build/ci-release-artifacts
          if-no-files-found: error
          retention-days: 14

  ci-contract:
    name: CI contract guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

      - name: Validate CI contract
        run: python3 scripts/ci/validate_ci_contract.py --self-test
