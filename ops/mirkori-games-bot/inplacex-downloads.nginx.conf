location = /downloads/InplaceX.apk {
    alias /var/www/inplacex-downloads/InplaceX.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="InplaceX.apk"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    limit_except GET {
        deny all;
    }
}
