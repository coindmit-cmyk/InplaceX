# Define this once in nginx's http context:
# limit_req_zone $binary_remote_addr zone=inplacex_ad_market:10m rate=30r/m;

# Include the remaining directives only in the exact ad-market location.
# The access log is disabled there so raw client IP is not retained for this
# coarse routing request. Security/error logs remain governed by operator policy.
limit_req zone=inplacex_ad_market burst=10 nodelay;
access_log off;

# Overwrite any caller-supplied value instead of extending X-Forwarded-For.
proxy_set_header X-InplaceX-Client-IP $remote_addr;

# Keep the normal reverse-proxy contract explicit.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
