# Include this file in the public HTTPS location that proxies to InplaceX.
# It overwrites any caller-supplied value instead of extending X-Forwarded-For.
proxy_set_header X-InplaceX-Client-IP $remote_addr;

# Keep the normal reverse-proxy contract explicit.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
