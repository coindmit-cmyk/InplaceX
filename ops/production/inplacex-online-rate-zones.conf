# Install inside nginx's http context (normally /etc/nginx/conf.d/).
limit_req_zone $binary_remote_addr zone=inplacex_online_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=inplacex_online_connections:10m;
limit_req_zone $binary_remote_addr zone=inplacex_ad_market:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=inplacex_online_operator:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=inplacex_online_operator_connections:1m;
limit_conn_zone $server_name zone=inplacex_online_global_connections:1m;
